# Virtual hosts de referência para backend.alenfe.alecriminteligente.com.br.
# Este domínio faz proxy para a árvore completa de rotas Fastify.
# Exponha somente após revisar autenticação de cada rota e proteger as APIs por chave/JWT.
# Ajuste os caminhos do certificado e preserve os includes ACME gerados pelo aaPanel.

server {
    listen 80;
    server_name backend.alenfe.alecriminteligente.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/backend.alenfe.alecriminteligente.com.br;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name backend.alenfe.alecriminteligente.com.br;

    ssl_certificate     /www/server/panel/vhost/cert/backend.alenfe.alecriminteligente.com.br/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/backend.alenfe.alecriminteligente.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ALENFE_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fastify deve escutar somente em 127.0.0.1:3001.
    # Todas as rotas HTTP do serviço são encaminhadas por este host.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Não exponha dotfiles por este virtual host.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    access_log /www/wwwlogs/backend.alenfe.alecriminteligente.com.br.log;
    error_log  /www/wwwlogs/backend.alenfe.alecriminteligente.com.br.error.log;
}
