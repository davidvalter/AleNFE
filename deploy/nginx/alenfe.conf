# Virtual hosts de referência para alenfe.alecriminteligente.com.br.
# Ajuste os caminhos do certificado, o socket PHP-FPM e o diretório raiz ao servidor.
# No aaPanel, preserve os includes de validação ACME gerados pelo painel.

server {
    listen 80;
    server_name alenfe.alecriminteligente.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/alenfe.alecriminteligente.com.br/src/public;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name alenfe.alecriminteligente.com.br;

    root /www/wwwroot/alenfe.alecriminteligente.com.br/src/public;
    index index.php index.html;

    ssl_certificate     /www/server/panel/vhost/cert/alenfe.alecriminteligente.com.br/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/alenfe.alecriminteligente.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ALENFE_SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    # Rotas de API consumidas pelo painel (mesma origem, sem CORS).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Rotas SEFAZ usadas pelo painel.
    location ^~ /sefaz/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Não execute scripts PHP que não existam no diretório público.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Arquivos estáticos inexistentes devem responder 404, sem cair no PHP.
    location ~* \.(?:jpg|jpeg|png|gif|ico|css|js|woff|woff2|svg)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Bloqueia dotfiles, arquivos de configuração, cópias e segredos.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* \.(?:env|ini|log|sql|bak|old|swp|pem|key|p12|pfx)$ {
        return 404;
    }

    access_log /www/wwwlogs/alenfe.alecriminteligente.com.br.log;
    error_log  /www/wwwlogs/alenfe.alecriminteligente.com.br.error.log;
}
